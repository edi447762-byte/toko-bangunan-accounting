<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Toko Bangunan</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F9FAFB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #1F2937;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
    }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: #6B7280; line-height: 1.6; margin: 8px 0 20px; }
    button {
      background: #F59E0B;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon { font-size: 64px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏗️</div>
    <h1>Tidak Ada Koneksi</h1>
    <p>
      Aplikasi butuh koneksi internet untuk sinkronisasi data.
      Sambungkan kembali internet Anda lalu coba lagi.
    </p>
    <button onclick="location.reload()">🔄 Coba Lagi</button>
  </div>
</body>
</html>
