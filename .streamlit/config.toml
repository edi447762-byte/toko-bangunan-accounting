[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10
# Port default
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#F59E0B"        # oranye konstruksi
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#1F2937"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"          # sembunyikan menu Streamlit di mobile
